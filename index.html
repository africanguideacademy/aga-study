<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0f07">
<meta name="description" content="African Guide Academy study app - learn the birds of the savanna by sight and by sound.">
<title>Pocket Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Guide">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <button class="icon-btn" id="backBtn" hidden aria-label="Back"></button>
    <a class="logo" id="logo" href="https://www.guidetrainingcourses.com" target="_blank" rel="noopener" aria-label="African Guide Academy website (opens in a new tab)"><img src="brand/logo-white.png" alt="African Guide Academy" width="320" height="122"></a>
    <div class="appbar-title" id="barTitle"></div>
    <span class="net" id="netBadge" hidden>Offline</span>
    <div class="appbar-right" id="topRight"></div>
  </div>
  <div class="quiz-progress" id="quizProgress" hidden><span></span></div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <a href="#/" data-tab="home"></a>
  <a href="#/progress" data-tab="progress"></a>
  <a href="#/offline" data-tab="offline"></a>
</nav>
<script src="data.js"></script>
<script>
  // ?preview loads draft questions for reviewers (not linked anywhere in the app)
  if (/[?&]preview\b/.test(location.search)) document.write('<script src="data-preview.js"><\/script>');
</script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
